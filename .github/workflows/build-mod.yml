name: Build VulkanBoost Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-native:
    name: Build Native Library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up C++
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
        
      - name: Compile Native Library (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p build-native
          cd build-native
          cmake ../fabric-mod/src/main/cpp
          make
          
      - name: Compile Native Library (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir build-native
          cd build-native
          cmake ../fabric-mod/src/main/cpp
          cmake --build . --config Release
          
      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: build-native/

  build-java:
    name: Build Fabric Mod
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Download Native Artifacts
        uses: actions/download-artifact@v4
        with:
          path: fabric-mod/src/main/resources/natives
          
      - name: Build with Gradle
        run: |
          cd fabric-mod
          chmod +x gradlew
          ./gradlew build
          
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: VulkanBoost-Mod
          path: fabric-mod/build/libs/*.jar
